name: Unit Test

on:
  pull_request:
    paths:
      - 'src/features/**/*.tsx'
      - 'src/ui/**/*.tsx'
      - '!src/**/*.stories.tsx'
      - 'vitest.unit.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/component-test.yml'
      - 'scripts/**'
      - 'tsconfig.json'
  push:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm run test:unit
      - name: Run script regression tests
        run: pnpm run test:scripts

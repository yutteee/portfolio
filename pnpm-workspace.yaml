# 1. pnpmセキュリティ設定
# - https://pnpm.io/supply-chain-security
# - https://pnpm.io/blog/2025/12/05/newsroom-npm-supply-chain-security

# 1.1. `preinstall`や`postinstall`といったスクリプトをブロックする
strictDepBuilds: true

# 1.2. 新しいパッケージが公開されてから一定期間待ってから利用する
minimumReleaseAge: 10080 # 7日 = 168時間 = 10080分
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# 1.3. 新しいバージョンの認証レベルが古いバージョンより低い場合、インストールを拒否
trustPolicy: no-downgrade
trustLockfile: false

# 1.4. 間接的な依存関係のGitリポジトリやURL直リンクをダウンロードしようとした場合にブロックする
blockExoticSubdeps: true
verifyStoreIntegrity: true

# 上流が要求する旧版を、信頼度条件や脆弱性修正に適合する公開済みの版へ置き換える。
overrides:
  chokidar@4.0.3: 5.0.0
  semver@6.3.1: 7.8.5
  '@xmldom/xmldom@0.9.10': 0.9.12
  katex@0.17.0: 0.18.2
  http-cache-semantics@4.2.0: 4.3.0
  'gray-matter@4.0.3>js-yaml': 4.3.2

allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
